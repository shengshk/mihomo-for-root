#!/system/bin/sh

# ════════════════════
# Mihomo For Root - 配置文件
# ════════════════════

# 系统初始化：检查 busybox 并设置环境变量
if ! command -v busybox &> /dev/null; then
  export PATH="/data/adb/magisk:/data/adb/ksu/bin:/data/adb/ap/bin:$PATH:/system/bin"
fi

# ════════════════════
# 核心路径配置 (请勿修改)
# ════════════════════

box_dir="/data/adb/box"
box_run="${box_dir}/run"
box_run_state="${box_run}/state"
box_run_locks="${box_run}/locks"

mkdir -p "${box_run_state}" "${box_run_locks}" >/dev/null 2>&1 || true

box_log="${box_run}/runs.log"
box_pid="${box_run}/box.pid"
bin_dir="${box_dir}/bin"
system_packages_file="/data/system/packages.list"
uid_list="${box_run_state}/appuid.list"
. "$box_dir/scripts/ports.utils"

# ════════════════════
# 基础设置
# ════════════════════

# 开机自启
boot_auto_start="true"
box_user_group="root:net_admin"

# ════════════════════
# 代理核心配置
# ════════════════════

bin_name="mihomo"

# 追加 Android 当前默认网络的 IPv4 DNS，保留源 YAML 的原有解析器。
# 只覆盖手机生成的运行配置，不改原始 config.yaml。
follow_network_dns="false"
# 网络变化由事件触发；以下为漏报/不支持监听时的兜底间隔，60～300 秒。
network_dns_interval="60"
bin_list=("mihomo")
bin_path="${bin_dir}/${bin_name}"
bin_log="${box_run}/${bin_name}.log"

# 启动时自动修改核心配置文件
auto_modify_config="true"

# ════════════════════
# 网络配置
# ════════════════════

# 网络模式: tun / tproxy / redirect / mixed / enhance
network_mode="tun"
tproxy_port="9898"
redir_port="9797"
ipv6="true"

# 性能模式（兼容性不高）
performance_mode="false"
quic="enable"
mihomo_dns_forward="enable"

proxy_tcp="true"
proxy_udp="true"

dns_hijack_tcp="true"
dns_hijack_udp="true"

# DNS 劫持策略: disable / tproxy/ redirect
dns_hijack_mode="tproxy"

# 绕过大陆 IP（需要设备支持 ipset）
bypass_cn_ip="false"
bypass_cn_ip_v4="false"
bypass_cn_ip_v6="false"
# CNIP 例外应用
cnip_force_proxy_apps=()
cn_ip_file="${box_run_state}/cn_ip.txt"
cn_ipv6_file="${box_run_state}/cn_ipv6.txt"
cn_ip_url="https://ispip.clang.cn/all_cn.txt"
cn_ipv6_url="https://ispip.clang.cn/all_cn_ipv6.txt"

# 热点场景 MAC 黑白名单（仅对热点/入站接口生效，默认关闭）
mac_filter="false"
mac_mode="blacklist"
macs_list=()

# ════════════════════
# 代理模式配置
# ════════════════════

# 代理模式: blacklist (黑名单) / whitelist (白名单) / core (核心模式)
proxy_mode="core"

# ════════════════════
# 订阅管理
# ════════════════════

# Mihomo 订阅链接数组
subscription_url_mihomo=()
# Mihomo 订阅配置文件名数组
name_provide_mihomo_config=()
# Mihomo 订阅文件存放目录
mihomo_provide_path="${box_dir}/mihomo/proxy_provider"

# 是否支持订阅中的自定义规则
custom_rules_subs="false"
name_provide_mihomo_rules="rules.yaml"
mihomo_provide_rules="${box_dir}/mihomo/provide/${name_provide_mihomo_rules}"


# ════════════════════
# 网络状态控制
# ════════════════════

# 是否根据网络状态自动控制服务（总开关）
enable_network_service_control="false"
# WiFi 连接时是否启用模块
use_module_on_wifi="true"
# WiFi 断开时是否启用模块
use_module_on_wifi_disconnect="true"
# 是否启用 WiFi 匹配（SSID/BSSID）
use_ssid_matching="false"
# SSID 匹配模式: blacklist (黑名单) / whitelist (白名单)
use_wifi_list_mode="blacklist"
# WiFi SSID 列表
wifi_ssids_list=()
# WiFi BSSID 列表
wifi_bssids_list=()
# 是否启用网络切换调试日志
inotify_log_enabled="true"

# ════════════════════
# 性能优化
# ════════════════════

# 内存限制
cgroup_memcg="false"
memcg_limit="100M"
# CPU 核心分配
cgroup_cpuset="false"
allow_cpu="0-7"
# 磁盘 I/O 权重
cgroup_blkio="false"
weight=""

# ════════════════════
# 核心配置文件路径
# ════════════════════

# Mihomo 配置文件
name_mihomo_config="config.yaml"
mihomo_config="${box_dir}/mihomo/${name_mihomo_config}"





# ════════════════════
# 自动更新配置
# ════════════════════

# true: 覆盖配置文件, false: 只更新订阅
renew="false"
# 是否启用订阅自动更新
update_subscription="false"
# 是否启用 GeoX 数据自动更新
update_geo="false"

# 是否启用定时任务
run_crontab="false"
# 定时任务时间
interva_update="0 0,6,12,18 * * *"

# ════════════════════
# 下载设置
# ════════════════════

# GitHub 访问令牌
githubtoken=""
# 是否使用镜像加速 GitHub 下载
use_ghproxy="false"
# 镜像加速地址
url_ghproxy="https://ghfast.top"

# 核心版本: enable (稳定版) / disable (预发行版)
mihomo_stable="enable"

# ════════════════════
# 代理规则配置（请勿修改）
# ════════════════════

write_listap="${box_dir}/ap.list.cfg"
pkg_config="${box_dir}/package.list.cfg"
gid_config="${box_dir}/gid.list.cfg"
[ ! -f "${write_listap}" ] && touch "${write_listap}"
[ ! -f "${pkg_config}" ] && touch "${pkg_config}"
[ ! -f "${gid_config}" ] && touch "${gid_config}"

prefixed_list=($(sed -n '/^[0-9][0-9]*:/p' "${pkg_config}"))
unprefixed_list_converted=($(sed -n '/\./p' "${pkg_config}" | grep -v -E '^[0-9]+:|^[0-9]+$|^[[:space:]]*#' | sed 's/^/0:/'))
packages_list=("${prefixed_list[@]}" "${unprefixed_list_converted[@]}")
gid_list=($(busybox awk '!/^#/ && /^[0-9]+$/ {print $1}' "${gid_config}"))

ap_list=($(busybox awk '/^allow / {print $2}' "${write_listap}"))
ignore_ap_list=($(busybox awk '/^ignore / {print $2}' "${write_listap}"))

# 手机偏好仅覆盖运行配置；原始 YAML 不随开关改写。
manage_dir="${box_dir}/manage"
preferences_file="${manage_dir}/preferences.json"
tun_mode="follow"
dns_mode="follow"
ipv6_mode="follow"
dns_hijack_setting="follow"
adguardhome_enabled="false"
dns_gate_managed=false
if [ -x "$bin_dir/dns-gate" ] && [ -f "$box_dir/scripts/box.dns-gate" ]; then dns_gate_managed=true; fi
routing_mode="rule"
if [ -s "$mihomo_config" ] && [ -x "$bin_dir/yq" ]; then
  routing_mode=$("$bin_dir/yq" -r '.mode // "rule"' "$mihomo_config" 2>/dev/null)
fi
if [ -s "$preferences_file" ] && [ -x "$bin_dir/yq" ]; then
  adguardhome_enabled=$("$bin_dir/yq" -r ' .adguardhome_enabled // false' "$preferences_file" 2>/dev/null)
  tun_mode=$("$bin_dir/yq" -r ' .tun_mode // "follow"' "$preferences_file" 2>/dev/null)
  dns_mode=$("$bin_dir/yq" -r '.dns_mode // "follow"' "$preferences_file" 2>/dev/null)
  ipv6_mode=$("$bin_dir/yq" -r '.ipv6_mode' "$preferences_file" 2>/dev/null)
  dns_hijack_setting=$("$bin_dir/yq" -r '.dns_hijack_mode // "follow"' "$preferences_file" 2>/dev/null)
  saved_routing_mode=$("$bin_dir/yq" -r '.routing_mode // ""' "$preferences_file" 2>/dev/null)
  case "$saved_routing_mode" in rule|global|direct) routing_mode="$saved_routing_mode" ;; esac
  follow_network_dns=$("$bin_dir/yq" -r '.append_network_dns' "$preferences_file" 2>/dev/null)
  case "$("$bin_dir/yq" -r '.app_mode' "$preferences_file" 2>/dev/null)" in
    include) proxy_mode="whitelist"; app_key=include_apps ;;
    exclude) proxy_mode="blacklist"; app_key=exclude_apps ;;
    *) proxy_mode="core"; app_key=include_apps ;;
  esac
  packages_list=($("$bin_dir/yq" -r ".${app_key}[]" "$preferences_file" 2>/dev/null | sed 's/^/0:/'))
fi
case "$ipv6_mode" in
  on) ipv6=true ;;
  off) ipv6=false ;;
  *)
    if [ -s "$mihomo_config" ] && [ -x "$bin_dir/yq" ]; then
      configured_ipv6=$("$bin_dir/yq" -r '.ipv6' "$mihomo_config" 2>/dev/null)
      [ "$configured_ipv6" != false ] && ipv6=true || ipv6=false
    fi ;;
esac

if [ -f "$box_dir/scripts/network.utils" ] && [ -x "$bin_dir/yq" ]; then
  . "$box_dir/scripts/network.utils"
  mfr_tun_resolve "$mihomo_config"
  mfr_dns_resolve "$mihomo_config"
fi

# ════════════════════
# 日志系统（请勿修改）
# ════════════════════

append_box_log_line() {
  local target_file="$1"
  local target_dir
  shift
  [ -n "${target_file}" ] || return 0
  target_dir="${target_file%/*}"
  if [ "${target_dir}" != "${target_file}" ]; then
    mkdir -p "${target_dir}" >/dev/null 2>&1 || true
  fi
  printf '%s\n' "$*" >> "${target_file}" 2>/dev/null || true
}

log() {
  local normal="\033[0m"
  local red="\033[1;31m"
  local green="\033[1;32m"
  local yellow="\033[1;33m"
  local blue="\033[1;34m"
  local color
  local level="$1"
  shift
  local timestamp
  local raw_message
  local log_line
  local message

  timestamp="$(date '+%Y-%m-%d %H:%M:%S')"
  raw_message="$*"

  case "${level}" in
    Info) color="${blue}" ;;
    Error) color="${red}" ;;
    Warn|Warning) level="Warn"; color="${yellow}" ;;
    *) color="${green}" ;;
  esac

  while IFS= read -r log_line || [ -n "${log_line}" ]; do
    message="${timestamp} [${level}]: ${log_line}"
    append_box_log_line "${box_log}" "${message}"

    if [ -t 1 ]; then
      printf '%b\n' "${color}${message}${normal}"
    else
      printf '%s\n' "${message}"
    fi
  done <<EOF
${raw_message}
EOF

  if [[ $TOAST ]]; then
    true
  fi
}
